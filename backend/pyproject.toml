[project]
name = "backend"
version = "0.1.0"
description = "InsightFlow — AI Business Intelligence Agent backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "celery>=5.6.3",
    "duckdb>=1.5.1",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=2.0.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.14.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sarvamai>=0.1.33",
    "sentry-sdk[fastapi]>=2.20.0",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "tenacity>=9.0.0",
    "uvicorn>=0.52.4",
]

# NOTE on phased dependencies (see roadmap.txt):
#   Phase 1 (Clerk)        -> clerk-backend-api
#   Phase 2 (Razorpay)     -> razorpay
#   Phase 3 (integrations) -> google-api-python-client, google-auth,
#                             google-auth-oauthlib, notion-client, slack-sdk
#   Phase 4 (agent LLM)    -> langchain-sarvam
# Added when each phase starts, to keep the dependency surface (and CI
# install time) matched to what's actually implemented.

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff>=0.14.0",
    "mypy>=1.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
