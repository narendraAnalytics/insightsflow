# Render blueprint — backend API only (Phase 8, stage 1). Frontend is on Vercel.
# Secrets marked `sync: false` are entered once in the Render dashboard
# (never committed). Replace <service> URLs after the first deploy if the
# service name is taken.
services:
  - type: web
    name: insightflow-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: singapore # closest to Neon ap-southeast-1 and to India
    plan: starter # free sleeps after 15 min idle
    healthCheckPath: /api/v1/healthz
    autoDeploy: true
    envVars:
      - key: PORT # the Dockerfile CMD listens on 8000
        value: "8000"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://insightsflow.vercel.app
      - key: FRONTEND_URL
        value: https://insightsflow.vercel.app
      - key: CLERK_AUTHORIZED_PARTIES
        value: https://insightsflow.vercel.app
      - key: PUBLIC_API_URL
        value: https://insightsflow-zeb7.onrender.com
      - key: GOOGLE_REDIRECT_URI
        value: https://insightsflow-zeb7.onrender.com/api/v1/connections/google/callback
      - key: GOOGLE_GMAIL_REDIRECT_URI # Gmail has its own consent flow + registered URI
        value: https://insightsflow-zeb7.onrender.com/api/v1/connections/gmail/callback
      - key: DATABASE_URL # Neon *production* branch, pooled
        sync: false
      - key: DATABASE_URL_DIRECT # Neon *production* branch, unpooled
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_STATE_SECRET # NEW value, not dev's
        sync: false
      - key: TOKEN_ENCRYPTION_KEYS # NEW value ("v1:<fernet key>"), not dev's
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: CRON_SECRET # 32+ random chars; also the X-Cron-Secret header on the pinger
        sync: false
      - key: SLACK_CLIENT_ID # Slack app -> Basic Information -> App Credentials
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI # must match a Redirect URL registered on the Slack app
        value: https://insightsflow-zeb7.onrender.com/api/v1/connections/slack/callback
      - key: NOTION_CLIENT_ID # Notion developer portal -> your connection -> OAuth
        sync: false
      - key: NOTION_CLIENT_SECRET
        sync: false
      - key: NOTION_REDIRECT_URI # must match a Redirect URI registered on the Notion connection
        value: https://insightsflow-zeb7.onrender.com/api/v1/connections/notion/callback
      - key: NOTION_VERSION # pinned Notion-Version header
        value: "2026-03-11"
