# Render blueprint — backend API only (Phase 8, stage 1). Frontend is on Vercel.
# Secrets marked `sync: false` are entered once in the Render dashboard
# (never committed). Replace <service> URLs after the first deploy if the
# service name is taken.
services:
  - type: web
    name: insightflow-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: singapore # closest to Neon ap-southeast-1 and to India
    plan: starter # free sleeps after 15 min idle
    healthCheckPath: /api/v1/healthz
    autoDeploy: true
    envVars:
      - key: PORT # the Dockerfile CMD listens on 8000
        value: "8000"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://insightsflow.vercel.app
      - key: FRONTEND_URL
        value: https://insightsflow.vercel.app
      - key: CLERK_AUTHORIZED_PARTIES
        value: https://insightsflow.vercel.app
      - key: PUBLIC_API_URL
        value: https://insightflow-api.onrender.com
      - key: GOOGLE_REDIRECT_URI
        value: https://insightflow-api.onrender.com/api/v1/connections/google/callback
      - key: DATABASE_URL # Neon *production* branch, pooled
        sync: false
      - key: DATABASE_URL_DIRECT # Neon *production* branch, unpooled
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_STATE_SECRET # NEW value, not dev's
        sync: false
      - key: TOKEN_ENCRYPTION_KEYS # NEW value ("v1:<fernet key>"), not dev's
        sync: false
      - key: SARVAM_API_KEY
        sync: false
